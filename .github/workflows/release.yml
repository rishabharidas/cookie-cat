name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Universal Cookie.app
        run: |
          chmod +x build.sh
          ./build.sh
          lipo -info Cookie.app/Contents/MacOS/Cookie

      - name: Package macOS Universal Zip
        run: ditto -c -k --sequesterRsrc --keepParent Cookie.app Cookie-macOS-Universal.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cookie-macOS-Universal
          path: Cookie-macOS-Universal.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Cookie-macOS-Universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
